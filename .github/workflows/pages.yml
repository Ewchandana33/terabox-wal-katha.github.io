name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate source files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "index.html"
            "404.html"
            "privacy-policy.html"
            "terms.html"
            "disclaimer.html"
            "copyright-policy.html"
            "cookie-policy.html"
            "accessibility.html"
            "contact.html"
            "styles.css"
            "legal.css"
            "app.js"
            "more-bundles.json"
            "manifest.webmanifest"
            "robots.txt"
            "sitemap.xml"
            "sitemap.txt"
            "ads.txt"
            "googlee91a7f05558ef324.html"
            ".nojekyll"
            "public/images/logo.png"
            "public/images/favicon.png"
          )

          failed=0

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=${file}::Required file is missing: ${file}"
              failed=1
              continue
            fi

            if [[ "$file" != ".nojekyll" ]] && [[ ! -s "$file" ]]; then
              echo "::error file=${file}::Required file is empty: ${file}"
              failed=1
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            echo "Files currently available in repository:"
            find . \
              -path "./.git" -prune -o \
              -path "./_site" -prune -o \
              -type f -print |
              sort
            exit 1
          fi

          if [[ -f "public/images/banner.png" ]]; then
            echo "Banner source found: public/images/banner.png"
          elif [[ -f "public/images/banner.jpg" ]]; then
            echo "Banner source found: public/images/banner.jpg"
          elif [[ -f "public/images/banner.jpeg" ]]; then
            echo "Banner source found: public/images/banner.jpeg"
          else
            echo "::error file=public/images::Banner image is missing"
            find public/images -maxdepth 1 -type f -print | sort
            exit 1
          fi

          node --check app.js

          echo "Source file validation passed."

      - name: Validate sitemap robots JSON and images
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import re
          import struct
          import xml.etree.ElementTree as ET

          from pathlib import Path
          from urllib.parse import urlsplit

          EXPECTED_URLS = (
              "https://wal-katha.github.io/",
              "https://wal-katha.github.io/privacy-policy.html",
              "https://wal-katha.github.io/terms.html",
              "https://wal-katha.github.io/disclaimer.html",
              "https://wal-katha.github.io/copyright-policy.html",
              "https://wal-katha.github.io/cookie-policy.html",
              "https://wal-katha.github.io/accessibility.html",
              "https://wal-katha.github.io/contact.html",
          )

          def validate_png(filename):
              path = Path(filename)
              data = path.read_bytes()

              if len(data) < 24:
                  raise SystemExit(
                      f"{filename}: PNG image is too small"
                  )

              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(
                      f"{filename}: invalid PNG signature"
                  )

              width, height = struct.unpack(
                  ">II",
                  data[16:24],
              )

              if width < 1 or height < 1:
                  raise SystemExit(
                      f"{filename}: invalid PNG dimensions"
                  )

              print(
                  f"{filename}: valid PNG "
                  f"({width}x{height})"
              )

          validate_png("public/images/logo.png")
          validate_png("public/images/favicon.png")

          banner_candidates = (
              Path("public/images/banner.png"),
              Path("public/images/banner.jpg"),
              Path("public/images/banner.jpeg"),
          )

          banner_path = next(
              (
                  path
                  for path in banner_candidates
                  if path.is_file()
              ),
              None,
          )

          if banner_path is None:
              raise SystemExit(
                  "Banner image is missing"
              )

          banner_data = banner_path.read_bytes()

          if banner_data.startswith(b"\x89PNG\r\n\x1a\n"):
              banner_format = "PNG"
          elif banner_data.startswith(b"\xff\xd8\xff"):
              banner_format = "JPEG"
          else:
              raise SystemExit(
                  f"{banner_path}: unsupported or invalid image"
              )

          print(
              f"{banner_path}: detected as {banner_format}"
          )

          sitemap_path = Path("sitemap.xml")
          sitemap_data = sitemap_path.read_bytes()

          if sitemap_data.startswith(b"\xef\xbb\xbf"):
              raise SystemExit(
                  "sitemap.xml: remove the UTF-8 BOM"
              )

          expected_declaration = (
              b'<?xml version="1.0" encoding="UTF-8"?>'
          )

          if not sitemap_data.startswith(expected_declaration):
              raise SystemExit(
                  "sitemap.xml: XML declaration must be "
                  "the first content"
              )

          try:
              root = ET.fromstring(sitemap_data)
          except ET.ParseError as error:
              raise SystemExit(
                  f"sitemap.xml: invalid XML: {error}"
              ) from error

          namespace = (
              "http://www.sitemaps.org/schemas/sitemap/0.9"
          )

          expected_root = f"{{{namespace}}}urlset"

          if root.tag != expected_root:
              raise SystemExit(
                  "sitemap.xml: incorrect root element "
                  "or namespace"
              )

          url_tag = f"{{{namespace}}}url"
          loc_tag = f"{{{namespace}}}loc"

          sitemap_urls = []

          for url_element in root.findall(url_tag):
              loc_elements = url_element.findall(loc_tag)

              if len(loc_elements) != 1:
                  raise SystemExit(
                      "sitemap.xml: each URL needs "
                      "exactly one loc element"
                  )

              location = (
                  loc_elements[0].text or ""
              ).strip()

              if not location:
                  raise SystemExit(
                      "sitemap.xml: empty loc element"
                  )

              parsed = urlsplit(location)

              if parsed.scheme != "https":
                  raise SystemExit(
                      f"sitemap.xml: URL must use HTTPS: "
                      f"{location}"
                  )

              if parsed.netloc != "wal-katha.github.io":
                  raise SystemExit(
                      f"sitemap.xml: incorrect host: "
                      f"{location}"
                  )

              if parsed.query or parsed.fragment:
                  raise SystemExit(
                      f"sitemap.xml: query or fragment "
                      f"is not allowed: {location}"
                  )

              sitemap_urls.append(location)

          if tuple(sitemap_urls) != EXPECTED_URLS:
              raise SystemExit(
                  "sitemap.xml URLs or URL order "
                  "does not match the expected list"
              )

          if len(sitemap_urls) != len(set(sitemap_urls)):
              raise SystemExit(
                  "sitemap.xml contains duplicate URLs"
              )

          text_sitemap_urls = tuple(
              line.strip()
              for line in Path("sitemap.txt")
                  .read_text(encoding="utf-8-sig")
                  .splitlines()
              if line.strip()
          )

          if text_sitemap_urls != EXPECTED_URLS:
              raise SystemExit(
                  "sitemap.txt URLs or URL order "
                  "does not match sitemap.xml"
              )

          robots_text = Path("robots.txt").read_text(
              encoding="utf-8-sig"
          )

          required_robots_lines = (
              "User-agent: *",
              "Allow: /",
              "Sitemap: "
              "https://wal-katha.github.io/sitemap.xml",
              "Sitemap: "
              "https://wal-katha.github.io/sitemap.txt",
          )

          for required_line in required_robots_lines:
              if required_line not in robots_text:
                  raise SystemExit(
                      "robots.txt: missing directive: "
                      f"{required_line}"
                  )

          if re.search(
              r"(?im)^\s*disallow\s*:\s*/\s*$",
              robots_text,
          ):
              raise SystemExit(
                  "robots.txt blocks the entire website"
              )

          verification = Path(
              "googlee91a7f05558ef324.html"
          ).read_text(
              encoding="utf-8-sig"
          ).strip()

          expected_verification = (
              "google-site-verification: "
              "googlee91a7f05558ef324.html"
          )

          if verification != expected_verification:
              raise SystemExit(
                  "Google verification file is incorrect"
              )

          try:
              manifest = json.loads(
                  Path("manifest.webmanifest").read_text(
                      encoding="utf-8"
                  )
              )
          except json.JSONDecodeError as error:
              raise SystemExit(
                  "manifest.webmanifest contains "
                  f"invalid JSON: {error}"
              ) from error

          manifest_fields = (
              "id",
              "name",
              "short_name",
              "start_url",
              "scope",
              "display",
              "background_color",
              "theme_color",
              "icons",
          )

          for field in manifest_fields:
              if field not in manifest:
                  raise SystemExit(
                      "manifest.webmanifest is missing "
                      f"field: {field}"
                  )

          if manifest["start_url"] != "/":
              raise SystemExit(
                  "manifest.webmanifest: "
                  "start_url must be /"
              )

          if manifest["scope"] != "/":
              raise SystemExit(
                  "manifest.webmanifest: scope must be /"
              )

          try:
              more_bundles = json.loads(
                  Path("more-bundles.json").read_text(
                      encoding="utf-8"
                  )
              )
          except json.JSONDecodeError as error:
              raise SystemExit(
                  "more-bundles.json contains "
                  f"invalid JSON: {error}"
              ) from error

          if not isinstance(more_bundles, list):
              raise SystemExit(
                  "more-bundles.json must contain an array"
              )

          if len(more_bundles) != 10:
              raise SystemExit(
                  "more-bundles.json must contain "
                  "exactly 10 items"
              )

          bundle_ids = set()

          for bundle in more_bundles:
              if not isinstance(bundle, dict):
                  raise SystemExit(
                      "Every additional bundle "
                      "must be an object"
                  )

              for field in (
                  "id",
                  "title",
                  "subtitle",
                  "url",
                  "demo",
              ):
                  if field not in bundle:
                      raise SystemExit(
                          "Additional bundle is missing "
                          f"field: {field}"
                      )

              bundle_ids.add(bundle["id"])

              parsed_url = urlsplit(
                  str(bundle["url"])
              )

              if (
                  parsed_url.scheme != "https"
                  or not parsed_url.netloc
              ):
                  raise SystemExit(
                      "Additional bundle URL must use "
                      f"HTTPS: {bundle['url']}"
                  )

          if bundle_ids != set(range(11, 21)):
              raise SystemExit(
                  "more-bundles.json must contain "
                  "bundle IDs 11 through 20"
              )

          print(
              "Sitemap, robots, JSON, verification "
              "and image validation passed."
          )
          PY

      - name: Prepare deployment directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          rsync -a \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="_site/" \
            ./ \
            _site/

          python3 - <<'PY'
          import shutil
          import struct

          from pathlib import Path

          source_candidates = (
              Path("public/images/banner.png"),
              Path("public/images/banner.jpg"),
              Path("public/images/banner.jpeg"),
          )

          source_banner = next(
              (
                  path
                  for path in source_candidates
                  if path.is_file()
              ),
              None,
          )

          if source_banner is None:
              raise SystemExit(
                  "Banner source image is missing"
              )

          banner_data = source_banner.read_bytes()

          if banner_data.startswith(b"\x89PNG\r\n\x1a\n"):
              deployed_name = "banner.png"
              deployed_mime = "image/png"
          elif banner_data.startswith(b"\xff\xd8\xff"):
              deployed_name = "banner.jpg"
              deployed_mime = "image/jpeg"
          else:
              raise SystemExit(
                  f"{source_banner}: invalid banner image"
              )

          destination_directory = Path(
              "_site/public/images"
          )

          destination_directory.mkdir(
              parents=True,
              exist_ok=True,
          )

          for old_name in (
              "banner.png",
              "banner.jpg",
              "banner.jpeg",
          ):
              old_path = (
                  destination_directory / old_name
              )

              if old_path.exists():
                  old_path.unlink()

          destination_banner = (
              destination_directory / deployed_name
          )

          shutil.copy2(
              source_banner,
              destination_banner,
          )

          text_extensions = {
              ".html",
              ".css",
              ".js",
              ".json",
              ".webmanifest",
              ".xml",
              ".txt",
          }

          replacement_count = 0

          for path in Path("_site").rglob("*"):
              if not path.is_file():
                  continue

              if path.suffix.lower() not in text_extensions:
                  continue

              try:
                  content = path.read_text(
                      encoding="utf-8"
                  )
              except UnicodeDecodeError:
                  continue

              updated_content = content

              for old_name in (
                  "banner.png",
                  "banner.jpg",
                  "banner.jpeg",
              ):
                  updated_content = (
                      updated_content.replace(
                          old_name,
                          deployed_name,
                      )
                  )

              if updated_content != content:
                  path.write_text(
                      updated_content,
                      encoding="utf-8",
                  )
                  replacement_count += 1

          deployed_data = destination_banner.read_bytes()

          if deployed_name == "banner.png":
              if not deployed_data.startswith(
                  b"\x89PNG\r\n\x1a\n"
              ):
                  raise SystemExit(
                      "Deployed banner.png is not PNG"
                  )

              if len(deployed_data) < 24:
                  raise SystemExit(
                      "Deployed banner.png is incomplete"
                  )

              width, height = struct.unpack(
                  ">II",
                  deployed_data[16:24],
              )

              print(
                  f"Deployed PNG banner: "
                  f"{width}x{height}"
              )

          if deployed_name == "banner.jpg":
              if not deployed_data.startswith(
                  b"\xff\xd8\xff"
              ):
                  raise SystemExit(
                      "Deployed banner.jpg is not JPEG"
                  )

          print(f"Source banner: {source_banner}")
          print(
              f"Deployed banner: {destination_banner}"
          )
          print(f"Detected MIME: {deployed_mime}")
          print(
              "Text files updated: "
              f"{replacement_count}"
          )
          PY

          required_deployed_files=(
            "_site/index.html"
            "_site/404.html"
            "_site/styles.css"
            "_site/legal.css"
            "_site/app.js"
            "_site/manifest.webmanifest"
            "_site/robots.txt"
            "_site/sitemap.xml"
            "_site/sitemap.txt"
            "_site/ads.txt"
            "_site/googlee91a7f05558ef324.html"
            "_site/public/images/logo.png"
            "_site/public/images/favicon.png"
          )

          for file in "${required_deployed_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=${file}::Deployment file is missing or empty: ${file}"
              exit 1
            fi
          done

          if [[ ! -f "_site/.nojekyll" ]]; then
            echo "::error file=_site/.nojekyll::.nojekyll is missing from deployment"
            exit 1
          fi

          if [[ -f "_site/public/images/banner.png" ]]; then
            echo "Deployment banner: banner.png"
          elif [[ -f "_site/public/images/banner.jpg" ]]; then
            echo "Deployment banner: banner.jpg"
          else
            echo "::error::Normalized deployment banner is missing"
            exit 1
          fi

          echo "Deployment directory prepared successfully:"
          find _site -type f -print | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
