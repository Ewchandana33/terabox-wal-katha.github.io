name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate website
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "index.html"
            "404.html"
            "privacy-policy.html"
            "terms.html"
            "disclaimer.html"
            "copyright-policy.html"
            "cookie-policy.html"
            "accessibility.html"
            "contact.html"
            "styles.css"
            "legal.css"
            "app.js"
            "more-bundles.json"
            "manifest.webmanifest"
            "robots.txt"
            "sitemap.xml"
            "sitemap.txt"
            "ads.txt"
            "googlee91a7f05558ef324.html"
            ".nojekyll"
            "public/images/logo.png"
            "public/images/banner.jpg"
            "public/images/favicon.png"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=${file}::Required file is missing"
              exit 1
            fi

            if [[ "$file" != ".nojekyll" && ! -s "$file" ]]; then
              echo "::error file=${file}::Required file is empty"
              exit 1
            fi
          done

          python3 - <<'PY'
          import json
          import re
          import struct
          import xml.etree.ElementTree as ET

          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          SITE_ORIGIN = "https://wal-katha.github.io"

          INDEXABLE_HTML_FILES = (
              "index.html",
              "privacy-policy.html",
              "terms.html",
              "disclaimer.html",
              "copyright-policy.html",
              "cookie-policy.html",
              "accessibility.html",
              "contact.html",
          )

          HTML_FILES = INDEXABLE_HTML_FILES + (
              "404.html",
          )

          EXPECTED_CANONICALS = {
              "index.html":
                  "https://wal-katha.github.io/",
              "privacy-policy.html":
                  "https://wal-katha.github.io/privacy-policy.html",
              "terms.html":
                  "https://wal-katha.github.io/terms.html",
              "disclaimer.html":
                  "https://wal-katha.github.io/disclaimer.html",
              "copyright-policy.html":
                  "https://wal-katha.github.io/copyright-policy.html",
              "cookie-policy.html":
                  "https://wal-katha.github.io/cookie-policy.html",
              "accessibility.html":
                  "https://wal-katha.github.io/accessibility.html",
              "contact.html":
                  "https://wal-katha.github.io/contact.html",
          }

          EXPECTED_SITEMAP_URLS = tuple(
              EXPECTED_CANONICALS.values()
          )

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = set()
                  self.references = []
                  self.canonicals = []
                  self.descriptions = []
                  self.titles = []
                  self.robots_values = []
                  self.json_ld_blocks = []
                  self.bundle_numbers = []

                  self._inside_title = False
                  self._title_parts = []

                  self._inside_json_ld = False
                  self._json_ld_parts = []

              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)

                  element_id = attributes.get("id")

                  if element_id:
                      if element_id in self.ids:
                          raise ValueError(
                              f"Duplicate HTML id: {element_id}"
                          )

                      self.ids.add(element_id)

                  bundle_number = attributes.get("data-bundle")

                  if bundle_number:
                      self.bundle_numbers.append(bundle_number)

                  for attribute_name in ("href", "src"):
                      value = attributes.get(attribute_name)

                      if value:
                          self.references.append(
                              (tag, attribute_name, value)
                          )

                  if tag == "link":
                      rel_values = set(
                          attributes.get("rel", "")
                          .lower()
                          .split()
                      )

                      if "canonical" in rel_values:
                          canonical = attributes.get("href")

                          if canonical:
                              self.canonicals.append(canonical)

                  if tag == "meta":
                      meta_name = (
                          attributes.get("name", "")
                          .strip()
                          .lower()
                      )

                      if meta_name == "description":
                          self.descriptions.append(
                              attributes.get("content", "")
                          )

                      if meta_name == "robots":
                          self.robots_values.append(
                              attributes.get("content", "")
                              .strip()
                              .lower()
                          )

                  if tag == "title":
                      self._inside_title = True
                      self._title_parts = []

                  if (
                      tag == "script"
                      and attributes.get("type", "").lower()
                      == "application/ld+json"
                  ):
                      self._inside_json_ld = True
                      self._json_ld_parts = []

              def handle_endtag(self, tag):
                  if tag == "title" and self._inside_title:
                      self.titles.append(
                          "".join(self._title_parts).strip()
                      )
                      self._inside_title = False

                  if tag == "script" and self._inside_json_ld:
                      self.json_ld_blocks.append(
                          "".join(self._json_ld_parts).strip()
                      )
                      self._inside_json_ld = False

              def handle_data(self, data):
                  if self._inside_title:
                      self._title_parts.append(data)

                  if self._inside_json_ld:
                      self._json_ld_parts.append(data)

          def parse_page(filename):
              content = Path(filename).read_text(
                  encoding="utf-8"
              )

              parser = PageParser()
              parser.feed(content)
              parser.close()

              return content, parser

          parsed_pages = {}

          for filename in HTML_FILES:
              content, parser = parse_page(filename)
              lowered = content.lower()

              if not lowered.lstrip().startswith("<!doctype html>"):
                  raise SystemExit(
                      f"{filename}: missing or misplaced HTML doctype"
                  )

              if "</html>" not in lowered:
                  raise SystemExit(
                      f"{filename}: missing closing html tag"
                  )

              if 'lang="en"' not in lowered:
                  raise SystemExit(
                      f"{filename}: missing lang=\"en\""
                  )

              if len(parser.titles) != 1:
                  raise SystemExit(
                      f"{filename}: expected exactly one title"
                  )

              if not parser.titles[0]:
                  raise SystemExit(
                      f"{filename}: title must not be empty"
                  )

              if len(parser.descriptions) != 1:
                  raise SystemExit(
                      f"{filename}: expected exactly one "
                      "meta description"
                  )

              if not parser.descriptions[0].strip():
                  raise SystemExit(
                      f"{filename}: meta description is empty"
                  )

              for json_ld_block in parser.json_ld_blocks:
                  try:
                      json.loads(json_ld_block)
                  except json.JSONDecodeError as error:
                      raise SystemExit(
                          f"{filename}: invalid JSON-LD: {error}"
                      ) from error

              parsed_pages[filename] = parser

          for filename in INDEXABLE_HTML_FILES:
              parser = parsed_pages[filename]
              expected_canonical = EXPECTED_CANONICALS[filename]

              if len(parser.canonicals) != 1:
                  raise SystemExit(
                      f"{filename}: expected exactly one canonical URL"
                  )

              if parser.canonicals[0] != expected_canonical:
                  raise SystemExit(
                      f"{filename}: canonical URL must be "
                      f"{expected_canonical}"
                  )

              for robots_value in parser.robots_values:
                  directives = {
                      directive.strip()
                      for directive in robots_value.split(",")
                  }

                  if "noindex" in directives:
                      raise SystemExit(
                          f"{filename}: indexable page contains noindex"
                      )

          error_page = parsed_pages["404.html"]

          if not any(
              "noindex" in robots_value
              for robots_value in error_page.robots_values
          ):
              raise SystemExit(
                  "404.html: missing noindex robots directive"
              )

          primary_bundle_numbers = set(
              parsed_pages["index.html"].bundle_numbers
          )

          expected_bundle_numbers = {
              str(number)
              for number in range(1, 11)
          }

          if primary_bundle_numbers != expected_bundle_numbers:
              raise SystemExit(
                  "index.html must contain bundle IDs 1-10; "
                  f"found={sorted(primary_bundle_numbers)}"
              )

          def resolve_internal_reference(source_file, reference):
              split = urlsplit(reference)

              if split.scheme or split.netloc:
                  return None

              if reference.startswith((
                  "mailto:",
                  "tel:",
                  "javascript:",
                  "data:",
              )):
                  return None

              path_value = unquote(split.path)

              if path_value == "":
                  target = Path(source_file)
              elif path_value.startswith("/"):
                  target = Path(
                      path_value.lstrip("/") or "index.html"
                  )
              else:
                  target = (
                      Path(source_file).parent / path_value
                  )

              if target.is_dir():
                  target = target / "index.html"

              return target, unquote(split.fragment)

          for source_file, parser in parsed_pages.items():
              for _, _, reference in parser.references:
                  resolved = resolve_internal_reference(
                      source_file,
                      reference
                  )

                  if resolved is None:
                      continue

                  target, fragment = resolved

                  if not target.exists():
                      raise SystemExit(
                          f"{source_file}: broken internal reference "
                          f"{reference!r}"
                      )

                  if (
                      fragment
                      and target.suffix.lower() == ".html"
                  ):
                      target_name = target.as_posix()

                      if target_name in parsed_pages:
                          target_parser = parsed_pages[target_name]
                      else:
                          _, target_parser = parse_page(
                              target_name
                          )

                      if fragment not in target_parser.ids:
                          raise SystemExit(
                              f"{source_file}: missing fragment "
                              f"#{fragment} in {target_name}"
                          )

          homepage = Path("index.html").read_text(
              encoding="utf-8"
          )

          protected_content = (
              "5000+ VIDEOS READY",
              "4.8/5 (9,800+)",
              "VERIFIED",
              "Exclusive",
              "Content",
          )

          for required_text in protected_content:
              if required_text not in homepage:
                  raise SystemExit(
                      "index.html: required promotional content "
                      f"is missing: {required_text}"
                  )

          if 'id="promotional-disclosure"' not in homepage:
              raise SystemExit(
                  "index.html: promotional disclosure is missing"
              )

          if "publisher-supplied information" not in homepage:
              raise SystemExit(
                  "index.html: promotional disclosure text is missing"
              )

          prohibited_rating_markup = (
              '"@type": "AggregateRating"',
              '"@type":"AggregateRating"',
              '"aggregateRating"',
          )

          for prohibited_value in prohibited_rating_markup:
              if prohibited_value in homepage:
                  raise SystemExit(
                      "index.html: AggregateRating markup "
                      "must not be present"
                  )

          sitemap_path = Path("sitemap.xml")
          sitemap_bytes = sitemap_path.read_bytes()

          if sitemap_bytes.startswith(b"\xef\xbb\xbf"):
              raise SystemExit(
                  "sitemap.xml: UTF-8 BOM must be removed"
              )

          if not sitemap_bytes.startswith(
              b'<?xml version="1.0" encoding="UTF-8"?>'
          ):
              raise SystemExit(
                  "sitemap.xml: XML declaration must be the "
                  "first content in the file"
              )

          try:
              sitemap_root = ET.fromstring(sitemap_bytes)
          except ET.ParseError as error:
              raise SystemExit(
                  f"sitemap.xml: invalid XML: {error}"
              ) from error

          sitemap_namespace = (
              "http://www.sitemaps.org/schemas/sitemap/0.9"
          )

          expected_root_tag = (
              f"{{{sitemap_namespace}}}urlset"
          )

          if sitemap_root.tag != expected_root_tag:
              raise SystemExit(
                  "sitemap.xml: incorrect sitemap namespace "
                  "or root element"
              )

          url_tag = f"{{{sitemap_namespace}}}url"
          loc_tag = f"{{{sitemap_namespace}}}loc"

          sitemap_urls = []

          for url_element in sitemap_root.findall(url_tag):
              locations = url_element.findall(loc_tag)

              if len(locations) != 1:
                  raise SystemExit(
                      "sitemap.xml: each URL must contain exactly "
                      "one loc element"
                  )

              location = (locations[0].text or "").strip()

              if not location:
                  raise SystemExit(
                      "sitemap.xml: empty loc element"
                  )

              parsed_url = urlsplit(location)

              if (
                  parsed_url.scheme != "https"
                  or parsed_url.netloc != "wal-katha.github.io"
              ):
                  raise SystemExit(
                      "sitemap.xml: URL must use the canonical "
                      f"HTTPS host: {location}"
                  )

              if parsed_url.query or parsed_url.fragment:
                  raise SystemExit(
                      "sitemap.xml: canonical URLs must not contain "
                      f"queries or fragments: {location}"
                  )

              sitemap_urls.append(location)

          if len(sitemap_urls) != len(set(sitemap_urls)):
              raise SystemExit(
                  "sitemap.xml: duplicate URLs found"
              )

          if tuple(sitemap_urls) != EXPECTED_SITEMAP_URLS:
              raise SystemExit(
                  "sitemap.xml URLs or order do not match "
                  "the canonical page list"
              )

          text_sitemap_lines = tuple(
              line.strip()
              for line in Path("sitemap.txt")
                  .read_text(encoding="utf-8-sig")
                  .splitlines()
              if line.strip()
          )

          if text_sitemap_lines != EXPECTED_SITEMAP_URLS:
              raise SystemExit(
                  "sitemap.txt URLs or order do not match "
                  "the canonical page list"
              )

          if len(text_sitemap_lines) != len(
              set(text_sitemap_lines)
          ):
              raise SystemExit(
                  "sitemap.txt: duplicate URLs found"
              )

          robots_text = Path("robots.txt").read_text(
              encoding="utf-8-sig"
          )

          required_robots_lines = (
              "User-agent: *",
              "Allow: /",
              "Sitemap: "
              "https://wal-katha.github.io/sitemap.xml",
              "Sitemap: "
              "https://wal-katha.github.io/sitemap.txt",
          )

          for required_line in required_robots_lines:
              if required_line not in robots_text:
                  raise SystemExit(
                      "robots.txt: required directive is missing: "
                      f"{required_line}"
                  )

          if re.search(
              r"(?im)^\s*disallow\s*:\s*/\s*$",
              robots_text
          ):
              raise SystemExit(
                  "robots.txt: the entire website is blocked"
              )

          verification_content = Path(
              "googlee91a7f05558ef324.html"
          ).read_text(
              encoding="utf-8-sig"
          ).strip()

          expected_verification_content = (
              "google-site-verification: "
              "googlee91a7f05558ef324.html"
          )

          if verification_content != expected_verification_content:
              raise SystemExit(
                  "Google verification file content is incorrect"
              )

          app_script = Path("app.js").read_text(
              encoding="utf-8"
          )

          required_primary_urls = (
              "https://1024terabox.com/s/1Uvm-lbRlZwIuLjWRaffprg",
              "https://1024terabox.com/s/1sJbqyVgz5GcW6kmvWWG9Yg",
              "https://1024terabox.com/s/1EjY0eZkY2JFDyJpKihZcIw",
              "https://1024terabox.com/s/11dfl5OFqPgac7tBoUsjnzQ",
              "https://1024terabox.com/s/1A-oWGLIvH90DPWyqGAY1Jw",
              "https://1024terabox.com/s/1ZIc39rpZ067AuHdll_2WLA",
              "https://1024terabox.com/s/13JMO9tr6W1vGDH4DCAIkPg",
              "https://1024terabox.com/s/1KxskEvHhaMfLyA-OOgBdHQ",
              "https://1024terabox.com/s/1H_VXYWAC-qZt3qx2Nw6uKA",
              "https://1024terabox.com/s/1oKaOWVfDkMkrigERpURgUg",
          )

          for required_url in required_primary_urls:
              if required_url not in app_script:
                  raise SystemExit(
                      "app.js: primary bundle URL is missing: "
                      f"{required_url}"
                  )

          with Path("more-bundles.json").open(
              encoding="utf-8"
          ) as more_bundles_file:
              more_bundles = json.load(more_bundles_file)

          if not isinstance(more_bundles, list):
              raise SystemExit(
                  "more-bundles.json must contain an array"
              )

          if len(more_bundles) != 10:
              raise SystemExit(
                  "more-bundles.json must contain exactly "
                  "10 additional bundles"
              )

          expected_extra_ids = set(range(11, 21))
          actual_extra_ids = set()

          for item in more_bundles:
              if not isinstance(item, dict):
                  raise SystemExit(
                      "Each additional bundle must be an object"
                  )

              required_fields = (
                  "id",
                  "title",
                  "subtitle",
                  "url",
                  "demo",
              )

              for field in required_fields:
                  if field not in item:
                      raise SystemExit(
                          "Additional bundle is missing field: "
                          f"{field}"
                      )

              bundle_id = item["id"]

              if not isinstance(bundle_id, int):
                  raise SystemExit(
                      "Additional bundle ID must be an integer"
                  )

              if bundle_id in actual_extra_ids:
                  raise SystemExit(
                      "Duplicate additional bundle ID: "
                      f"{bundle_id}"
                  )

              actual_extra_ids.add(bundle_id)

              parsed_extra_url = urlsplit(item["url"])

              if (
                  parsed_extra_url.scheme != "https"
                  or not parsed_extra_url.netloc
              ):
                  raise SystemExit(
                      "Additional bundle URL must use HTTPS: "
                      f"{item['url']}"
                  )

          if actual_extra_ids != expected_extra_ids:
              raise SystemExit(
                  "more-bundles.json must contain IDs 11-20; "
                  f"found={sorted(actual_extra_ids)}"
              )

          with Path("manifest.webmanifest").open(
              encoding="utf-8"
          ) as manifest_file:
              manifest = json.load(manifest_file)

          required_manifest_fields = (
              "id",
              "name",
              "short_name",
              "start_url",
              "scope",
              "display",
              "background_color",
              "theme_color",
              "icons",
          )

          for field in required_manifest_fields:
              if field not in manifest:
                  raise SystemExit(
                      "manifest.webmanifest: missing field "
                      f"{field}"
                  )

          if manifest["start_url"] != "/":
              raise SystemExit(
                  "manifest.webmanifest: start_url must be /"
              )

          if manifest["scope"] != "/":
              raise SystemExit(
                  "manifest.webmanifest: scope must be /"
              )

          def validate_png(filename):
              data = Path(filename).read_bytes()

              if len(data) < 24:
                  raise SystemExit(
                      f"{filename}: PNG file is too small"
                  )

              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(
                      f"{filename}: invalid PNG signature"
                  )

              width, height = struct.unpack(
                  ">II",
                  data[16:24]
              )

              if width < 32 or height < 32:
                  raise SystemExit(
                      f"{filename}: PNG dimensions are too small"
                  )

          validate_png("public/images/logo.png")
          validate_png("public/images/favicon.png")

          banner = Path("public/images/banner.jpg").read_bytes()

          if not banner.startswith(b"\xff\xd8"):
              raise SystemExit(
                  "public/images/banner.jpg: invalid JPEG signature"
              )

          print(
              "HTML, canonical URLs, internal links, XML sitemap, "
              "text sitemap, robots.txt, verification file, JSON, "
              "manifest and image validation passed."
          )
          PY

          node --check app.js

          if ! grep -q "SITE_STYLES_COMPLETE" styles.css; then
            echo "::error file=styles.css::Completion marker is missing"
            exit 1
          fi

          if ! grep -q "LEGAL_STYLES_COMPLETE" legal.css; then
            echo "::error file=legal.css::Completion marker is missing"
            exit 1
          fi

          if ! grep -q "APP_SCRIPT_COMPLETE" app.js; then
            echo "::error file=app.js::Completion marker is missing"
            exit 1
          fi

      - name: Prepare deployment directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site/public/images

          site_files=(
            "index.html"
            "404.html"
            "privacy-policy.html"
            "terms.html"
            "disclaimer.html"
            "copyright-policy.html"
            "cookie-policy.html"
            "accessibility.html"
            "contact.html"
            "styles.css"
            "legal.css"
            "app.js"
            "more-bundles.json"
            "manifest.webmanifest"
            "robots.txt"
            "sitemap.xml"
            "sitemap.txt"
            "ads.txt"
            "googlee91a7f05558ef324.html"
            ".nojekyll"
          )

          for file in "${site_files[@]}"; do
            cp "$file" "_site/$file"
          done

          cp \
            "public/images/logo.png" \
            "_site/public/images/logo.png"

          cp \
            "public/images/banner.jpg" \
            "_site/public/images/banner.jpg"

          cp \
            "public/images/favicon.png" \
            "_site/public/images/favicon.png"

          test -s "_site/sitemap.xml"
          test -s "_site/sitemap.txt"
          test -s "_site/robots.txt"
          test -s "_site/googlee91a7f05558ef324.html"
          test -f "_site/.nojekyll"

          echo "Deployment directory:"
          find _site -type f -print | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
