name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "index.html"
            "404.html"
            "styles.css"
            "app.js"
            "manifest.webmanifest"
            "robots.txt"
            "sitemap.xml"
            "ads.txt"
            ".nojekyll"
            "public/images/logo.png"
            "public/images/banner.jpg"
            "public/images/favicon.png"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=${file}::Required file is missing"
              exit 1
            fi
          done

          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for filename in ("index.html", "404.html"):
              content = Path(filename).read_text(encoding="utf-8")

              if "<!doctype html>" not in content.lower():
                  raise SystemExit(
                      f"{filename}: missing <!doctype html>"
                  )

              if "</html>" not in content.lower():
                  raise SystemExit(
                      f"{filename}: missing closing </html> tag"
                  )

          with Path("manifest.webmanifest").open(
              encoding="utf-8"
          ) as manifest_file:
              json.load(manifest_file)

          ET.parse("sitemap.xml")

          print("Basic HTML, JSON and XML validation passed.")
          PY

          node --check app.js

          if ! grep -q "SITE_STYLES_COMPLETE" styles.css; then
            echo "::error file=styles.css::Completion marker is missing"
            exit 1
          fi

          if ! grep -q "APP_SCRIPT_COMPLETE" app.js; then
            echo "::error file=app.js::Completion marker is missing"
            exit 1
          fi

          echo "All required files passed validation."

      - name: Prepare deployment directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site/public/images

          cp index.html _site/index.html
          cp 404.html _site/404.html
          cp styles.css _site/styles.css
          cp app.js _site/app.js
          cp manifest.webmanifest _site/manifest.webmanifest
          cp robots.txt _site/robots.txt
          cp sitemap.xml _site/sitemap.xml
          cp ads.txt _site/ads.txt
          cp .nojekyll _site/.nojekyll

          cp public/images/logo.png \
            _site/public/images/logo.png

          cp public/images/banner.jpg \
            _site/public/images/banner.jpg

          cp public/images/favicon.png \
            _site/public/images/favicon.png

          echo "Deployment directory contents:"
          find _site -type f -print | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
