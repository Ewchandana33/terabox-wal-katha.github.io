name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "index.html"
            "404.html"
            "privacy-policy.html"
            "terms.html"
            "disclaimer.html"
            "copyright-policy.html"
            "cookie-policy.html"
            "accessibility.html"
            "contact.html"
            "styles.css"
            "legal.css"
            "app.js"
            "more-bundles.json"
            "manifest.webmanifest"
            "robots.txt"
            "sitemap.xml"
            "ads.txt"
            ".nojekyll"
            "public/images/logo.png"
            "public/images/banner.jpg"
            "public/images/favicon.png"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=${file}::Required file is missing"
              exit 1
            fi

            if [[ "$file" != ".nojekyll" && ! -s "$file" ]]; then
              echo "::error file=${file}::Required file is empty"
              exit 1
            fi
          done

          python3 - <<'PY'
          import json
          import struct
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          HTML_FILES = (
              "index.html",
              "404.html",
              "privacy-policy.html",
              "terms.html",
              "disclaimer.html",
              "copyright-policy.html",
              "cookie-policy.html",
              "accessibility.html",
              "contact.html",
          )

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = set()
                  self.references = []
                  self.canonicals = []
                  self.descriptions = []
                  self.titles = []
                  self.json_ld_blocks = []
                  self.bundle_numbers = []
                  self._inside_title = False
                  self._title_parts = []
                  self._inside_json_ld = False
                  self._json_ld_parts = []

              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)

                  element_id = attributes.get("id")

                  if element_id:
                      self.ids.add(element_id)

                  bundle_number = attributes.get("data-bundle")

                  if bundle_number:
                      self.bundle_numbers.append(bundle_number)

                  for attribute_name in ("href", "src"):
                      value = attributes.get(attribute_name)

                      if value:
                          self.references.append(
                              (tag, attribute_name, value)
                          )

                  if tag == "link":
                      rel_values = set(
                          attributes.get("rel", "").lower().split()
                      )

                      if "canonical" in rel_values:
                          href = attributes.get("href")

                          if href:
                              self.canonicals.append(href)

                  if (
                      tag == "meta"
                      and attributes.get("name", "").lower()
                      == "description"
                  ):
                      self.descriptions.append(
                          attributes.get("content", "")
                      )

                  if tag == "title":
                      self._inside_title = True
                      self._title_parts = []

                  if (
                      tag == "script"
                      and attributes.get("type", "").lower()
                      == "application/ld+json"
                  ):
                      self._inside_json_ld = True
                      self._json_ld_parts = []

              def handle_endtag(self, tag):
                  if tag == "title" and self._inside_title:
                      self.titles.append(
                          "".join(self._title_parts).strip()
                      )
                      self._inside_title = False

                  if tag == "script" and self._inside_json_ld:
                      self.json_ld_blocks.append(
                          "".join(self._json_ld_parts).strip()
                      )
                      self._inside_json_ld = False

              def handle_data(self, data):
                  if self._inside_title:
                      self._title_parts.append(data)

                  if self._inside_json_ld:
                      self._json_ld_parts.append(data)

          def parse_page(filename):
              content = Path(filename).read_text(
                  encoding="utf-8"
              )

              parser = PageParser()
              parser.feed(content)
              parser.close()

              return content, parser

          parsed_pages = {}

          for filename in HTML_FILES:
              content, parser = parse_page(filename)
              lowered = content.lower()

              if "<!doctype html>" not in lowered:
                  raise SystemExit(
                      f"{filename}: missing HTML doctype"
                  )

              if "</html>" not in lowered:
                  raise SystemExit(
                      f"{filename}: missing closing html tag"
                  )

              if len(parser.titles) != 1 or not parser.titles[0]:
                  raise SystemExit(
                      f"{filename}: must contain one non-empty title"
                  )

              if (
                  len(parser.descriptions) != 1
                  or not parser.descriptions[0].strip()
              ):
                  raise SystemExit(
                      f"{filename}: must contain one meta description"
                  )

              if 'lang="en"' not in lowered:
                  raise SystemExit(
                      f"{filename}: missing document language"
                  )

              if filename == "404.html":
                  if "noindex" not in lowered:
                      raise SystemExit(
                          "404.html: missing noindex directive"
                      )
              elif len(parser.canonicals) != 1:
                  raise SystemExit(
                      f"{filename}: expected one canonical URL"
                  )

              for json_ld_block in parser.json_ld_blocks:
                  json.loads(json_ld_block)

              parsed_pages[filename] = parser

          homepage_parser = parsed_pages["index.html"]

          expected_primary_bundles = {
              str(number)
              for number in range(1, 11)
          }

          actual_primary_bundles = set(
              homepage_parser.bundle_numbers
          )

          if actual_primary_bundles != expected_primary_bundles:
              raise SystemExit(
                  "index.html must contain primary bundle buttons 1-10; "
                  f"found={sorted(actual_primary_bundles)}"
              )

          def resolve_internal_reference(source_file, reference):
              split = urlsplit(reference)

              if split.scheme or split.netloc:
                  return None

              if reference.startswith((
                  "mailto:",
                  "tel:",
                  "javascript:",
                  "data:",
              )):
                  return None

              path_value = unquote(split.path)

              if path_value == "":
                  target = Path(source_file)
              elif path_value.startswith("/"):
                  target = Path(
                      path_value.lstrip("/") or "index.html"
                  )
              else:
                  target = (
                      Path(source_file).parent / path_value
                  )

              if target.is_dir():
                  target = target / "index.html"

              return target, unquote(split.fragment)

          for source_file, parser in parsed_pages.items():
              for _, _, reference in parser.references:
                  resolved = resolve_internal_reference(
                      source_file,
                      reference
                  )

                  if resolved is None:
                      continue

                  target, fragment = resolved

                  if not target.exists():
                      raise SystemExit(
                          f"{source_file}: broken internal reference "
                          f"{reference!r}"
                      )

                  if fragment and target.suffix.lower() == ".html":
                      target_name = target.as_posix()

                      if target_name in parsed_pages:
                          target_parser = parsed_pages[target_name]
                      else:
                          _, target_parser = parse_page(
                              target_name
                          )

                      if fragment not in target_parser.ids:
                          raise SystemExit(
                              f"{source_file}: missing fragment "
                              f"#{fragment} in {target_name}"
                          )

          expected_canonicals = {
              "index.html":
                  "https://wal-katha.github.io/",
              "privacy-policy.html":
                  "https://wal-katha.github.io/privacy-policy.html",
              "terms.html":
                  "https://wal-katha.github.io/terms.html",
              "disclaimer.html":
                  "https://wal-katha.github.io/disclaimer.html",
              "copyright-policy.html":
                  "https://wal-katha.github.io/copyright-policy.html",
              "cookie-policy.html":
                  "https://wal-katha.github.io/cookie-policy.html",
              "accessibility.html":
                  "https://wal-katha.github.io/accessibility.html",
              "contact.html":
                  "https://wal-katha.github.io/contact.html",
          }

          for filename, expected_url in expected_canonicals.items():
              actual_url = parsed_pages[filename].canonicals[0]

              if actual_url != expected_url:
                  raise SystemExit(
                      f"{filename}: canonical URL should be "
                      f"{expected_url}"
                  )

          homepage = Path("index.html").read_text(
              encoding="utf-8"
          )

          protected_content = (
              "5000+ VIDEOS READY",
              "4.8/5 (9,800+)",
              "VERIFIED",
              "Exclusive",
              "Content",
          )

          for required_text in protected_content:
              if required_text not in homepage:
                  raise SystemExit(
                      "index.html: required promotional content "
                      f"is missing: {required_text}"
                  )

          if 'id="promotional-disclosure"' not in homepage:
              raise SystemExit(
                  "index.html: promotional disclosure is missing"
              )

          if "publisher-supplied information" not in homepage:
              raise SystemExit(
                  "index.html: promotional disclosure text is missing"
              )

          prohibited_rating_markup = (
              '"@type": "AggregateRating"',
              '"@type":"AggregateRating"',
              '"aggregateRating"',
          )

          for prohibited_value in prohibited_rating_markup:
              if prohibited_value in homepage:
                  raise SystemExit(
                      "index.html: promotional rating must not be "
                      "published as structured AggregateRating data"
                  )

          app_script = Path("app.js").read_text(
              encoding="utf-8"
          )

          required_primary_urls = (
              "https://1024terabox.com/s/1Uvm-lbRlZwIuLjWRaffprg",
              "https://1024terabox.com/s/1sJbqyVgz5GcW6kmvWWG9Yg",
              "https://1024terabox.com/s/1EjY0eZkY2JFDyJpKihZcIw",
              "https://1024terabox.com/s/11dfl5OFqPgac7tBoUsjnzQ",
              "https://1024terabox.com/s/1A-oWGLIvH90DPWyqGAY1Jw",
              "https://1024terabox.com/s/1ZIc39rpZ067AuHdll_2WLA",
              "https://1024terabox.com/s/13JMO9tr6W1vGDH4DCAIkPg",
              "https://1024terabox.com/s/1KxskEvHhaMfLyA-OOgBdHQ",
              "https://1024terabox.com/s/1H_VXYWAC-qZt3qx2Nw6uKA",
              "https://1024terabox.com/s/1oKaOWVfDkMkrigERpURgUg",
          )

          for required_url in required_primary_urls:
              if required_url not in app_script:
                  raise SystemExit(
                      "app.js: primary bundle URL is missing: "
                      f"{required_url}"
                  )

          with Path("more-bundles.json").open(
              encoding="utf-8"
          ) as more_bundles_file:
              more_bundles = json.load(more_bundles_file)

          if not isinstance(more_bundles, list):
              raise SystemExit(
                  "more-bundles.json must contain an array"
              )

          if len(more_bundles) != 10:
              raise SystemExit(
                  "more-bundles.json must contain exactly "
                  "10 additional bundles"
              )

          expected_extra_ids = set(range(11, 21))
          actual_extra_ids = set()

          for item in more_bundles:
              if not isinstance(item, dict):
                  raise SystemExit(
                      "Each additional bundle must be an object"
                  )

              required_fields = (
                  "id",
                  "title",
                  "subtitle",
                  "url",
                  "demo",
              )

              for field in required_fields:
                  if field not in item:
                      raise SystemExit(
                          "Additional bundle is missing "
                          f"field: {field}"
                      )

              bundle_id = item["id"]

              if not isinstance(bundle_id, int):
                  raise SystemExit(
                      "Additional bundle ID must be an integer"
                  )

              if bundle_id in actual_extra_ids:
                  raise SystemExit(
                      f"Duplicate additional bundle ID: {bundle_id}"
                  )

              actual_extra_ids.add(bundle_id)

              split_url = urlsplit(item["url"])

              if (
                  split_url.scheme != "https"
                  or not split_url.netloc
              ):
                  raise SystemExit(
                      "Additional bundle URL must use HTTPS: "
                      f"{item['url']}"
                  )

          if actual_extra_ids != expected_extra_ids:
              raise SystemExit(
                  "more-bundles.json must contain IDs 11-20; "
                  f"found={sorted(actual_extra_ids)}"
              )

          with Path("manifest.webmanifest").open(
              encoding="utf-8"
          ) as manifest_file:
              manifest = json.load(manifest_file)

          required_manifest_fields = (
              "id",
              "name",
              "short_name",
              "start_url",
              "scope",
              "display",
              "background_color",
              "theme_color",
              "icons",
          )

          for field in required_manifest_fields:
              if field not in manifest:
                  raise SystemExit(
                      f"manifest.webmanifest: missing {field}"
                  )

          sitemap_tree = ET.parse("sitemap.xml")
          sitemap_root = sitemap_tree.getroot()

          namespace = {
              "sm": "http://www.sitemaps.org/schemas/sitemap/0.9"
          }

          sitemap_urls = {
              element.text.strip()
              for element in sitemap_root.findall(
                  "sm:url/sm:loc",
                  namespace
              )
              if element.text
          }

          expected_urls = set(expected_canonicals.values())

          if sitemap_urls != expected_urls:
              missing_urls = expected_urls - sitemap_urls
              extra_urls = sitemap_urls - expected_urls

              raise SystemExit(
                  "sitemap.xml URL mismatch; "
                  f"missing={sorted(missing_urls)}, "
                  f"extra={sorted(extra_urls)}"
              )

          def validate_png(filename):
              data = Path(filename).read_bytes()

              if len(data) < 24:
                  raise SystemExit(
                      f"{filename}: PNG file is too small"
                  )

              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(
                      f"{filename}: invalid PNG signature"
                  )

              width, height = struct.unpack(
                  ">II",
                  data[16:24]
              )

              if width < 32 or height < 32:
                  raise SystemExit(
                      f"{filename}: PNG dimensions are too small"
                  )

          validate_png("public/images/logo.png")
          validate_png("public/images/favicon.png")

          print(
              "HTML, bundle data, links, JSON, XML "
              "and image validation passed."
          )
          PY

          node --check app.js

          if ! grep -q "SITE_STYLES_COMPLETE" styles.css; then
            echo "::error file=styles.css::Completion marker is missing"
            exit 1
          fi

          if ! grep -q "LEGAL_STYLES_COMPLETE" legal.css; then
            echo "::error file=legal.css::Completion marker is missing"
            exit 1
          fi

          if ! grep -q "APP_SCRIPT_COMPLETE" app.js; then
            echo "::error file=app.js::Completion marker is missing"
            exit 1
          fi

      - name: Prepare deployment directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site/public/images

          site_files=(
            "index.html"
            "404.html"
            "privacy-policy.html"
            "terms.html"
            "disclaimer.html"
            "copyright-policy.html"
            "cookie-policy.html"
            "accessibility.html"
            "contact.html"
            "styles.css"
            "legal.css"
            "app.js"
            "more-bundles.json"
            "manifest.webmanifest"
            "robots.txt"
            "sitemap.xml"
            "ads.txt"
            ".nojekyll"
          )

          for file in "${site_files[@]}"; do
            cp "$file" "_site/$file"
          done

          cp \
            public/images/logo.png \
            _site/public/images/logo.png

          cp \
            public/images/banner.jpg \
            _site/public/images/banner.jpg

          cp \
            public/images/favicon.png \
            _site/public/images/favicon.png

          echo "Deployment directory:"
          find _site -type f -print | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
