name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate static files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "index.html"
            "404.html"
            "styles.css"
            "app.js"
            "manifest.webmanifest"
            "robots.txt"
            "sitemap.xml"
            "ads.txt"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done

          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path

          class DocumentParser(HTMLParser):
              pass

          for filename in ("index.html", "404.html"):
              parser = DocumentParser()
              parser.feed(Path(filename).read_text(encoding="utf-8"))
              parser.close()

          with Path("manifest.webmanifest").open(encoding="utf-8") as manifest_file:
              json.load(manifest_file)

          ET.parse("sitemap.xml")
          print("Static file validation passed.")
          PY

      - name: Prepare deployment directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          cp index.html _site/
          cp 404.html _site/
          cp styles.css _site/
          cp app.js _site/
          cp manifest.webmanifest _site/
          cp robots.txt _site/
          cp sitemap.xml _site/
          cp ads.txt _site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
