name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "index.html"
            "404.html"
            "privacy-policy.html"
            "terms.html"
            "disclaimer.html"
            "copyright-policy.html"
            "cookie-policy.html"
            "accessibility.html"
            "contact.html"
            "styles.css"
            "legal.css"
            "app.js"
            "manifest.webmanifest"
            "robots.txt"
            "sitemap.xml"
            "ads.txt"
            ".nojekyll"
            "public/images/logo.png"
            "public/images/banner.jpg"
            "public/images/favicon.png"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=${file}::Required file is missing"
              exit 1
            fi
          done

          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          html_files = (
              "index.html",
              "404.html",
              "privacy-policy.html",
              "terms.html",
              "disclaimer.html",
              "copyright-policy.html",
              "cookie-policy.html",
              "accessibility.html",
              "contact.html",
          )

          for filename in html_files:
              content = Path(filename).read_text(encoding="utf-8")
              lowered = content.lower()

              if "<!doctype html>" not in lowered:
                  raise SystemExit(
                      f"{filename}: missing HTML doctype"
                  )

              if "</html>" not in lowered:
                  raise SystemExit(
                      f"{filename}: missing closing html tag"
                  )

              if "<title>" not in lowered:
                  raise SystemExit(
                      f"{filename}: missing title"
                  )

              if 'name="description"' not in lowered:
                  raise SystemExit(
                      f"{filename}: missing meta description"
                  )

          with Path("manifest.webmanifest").open(
              encoding="utf-8"
          ) as manifest_file:
              json.load(manifest_file)

          ET.parse("sitemap.xml")

          print("HTML, JSON and XML validation passed.")
          PY

          node --check app.js

          if ! grep -q "SITE_STYLES_COMPLETE" styles.css; then
            echo "::error file=styles.css::Completion marker is missing"
            exit 1
          fi

          if ! grep -q "LEGAL_STYLES_COMPLETE" legal.css; then
            echo "::error file=legal.css::Completion marker is missing"
            exit 1
          fi

          if ! grep -q "APP_SCRIPT_COMPLETE" app.js; then
            echo "::error file=app.js::Completion marker is missing"
            exit 1
          fi

      - name: Prepare deployment directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site/public/images

          cp index.html _site/
          cp 404.html _site/
          cp privacy-policy.html _site/
          cp terms.html _site/
          cp disclaimer.html _site/
          cp copyright-policy.html _site/
          cp cookie-policy.html _site/
          cp accessibility.html _site/
          cp contact.html _site/
          cp styles.css _site/
          cp legal.css _site/
          cp app.js _site/
          cp manifest.webmanifest _site/
          cp robots.txt _site/
          cp sitemap.xml _site/
          cp ads.txt _site/
          cp .nojekyll _site/

          cp public/images/logo.png \
            _site/public/images/logo.png

          cp public/images/banner.jpg \
            _site/public/images/banner.jpg

          cp public/images/favicon.png \
            _site/public/images/favicon.png

          echo "Deployment directory:"
          find _site -type f -print | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
