<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#dff4ff">
    <meta name="robots" content="noindex, follow">

    <title>404 | Page not found</title>

    <meta
        name="description"
        content="The requested page could not be found. Return to the TeraBox Video Hub homepage."
    >

    <link
        rel="icon"
        href="https://raw.githubusercontent.com/wal-katha/wal-katha.github.io/main/public/images/favicon.png"
        type="image/png"
    >
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <main class="error-stage">
        <section class="error-card" aria-labelledby="error-title">
            <img
                class="error-logo"
                src="https://raw.githubusercontent.com/wal-katha/wal-katha.github.io/main/public/images/logo.png"
                width="160"
                height="160"
                alt="TeraBox Video Hub logo"
            >

            <p class="error-code" aria-hidden="true">404</p>

            <h1 id="error-title">Page not found</h1>

            <p>
                The page you requested may have been removed, renamed or entered
                incorrectly. Return to the homepage to continue browsing.
            </p>

            <a class="home-button" href="/">
                Return to homepage
            </a>
        </section>
    </main>
</body>
</html>
